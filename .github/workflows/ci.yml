name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy backend/src
      - name: Pytest
        run: uv run pytest
      - name: Dataset and ML pipeline smoke
        run: |
          rm -rf data artifacts
          uv run sentinelueba generate-demo
          uv run sentinelueba features materialize
          uv run sentinelueba datasets create --kind synthetic
          DATASET_ID="$(ls -1t data/datasets | head -n 1)"
          uv run sentinelueba datasets verify "$DATASET_ID"
          TRAIN_JSON="$(
            uv run sentinelueba ml train \
              --dataset synthetic \
              --dataset-id "$DATASET_ID" \
              --families autoencoder,isolation-forest \
              --autoencoder-epochs 6 \
              --if-n-estimators 16
          )"
          TRAIN_JSON="$TRAIN_JSON" uv run python - <<'PY'
          import json
          import os
          train = json.loads(os.environ["TRAIN_JSON"])
          assert train["split"]["train"]["count"] == 50, train["split"]
          assert train["split"]["calibration"]["count"] == 22, train["split"]
          assert train["split"]["test"]["count"] == 24, train["split"]
          assert len(train["split"]["scenario_window_ids"]) == 5, train["split"]
          metrics = [candidate["metrics"] for candidate in train["candidates"]]
          assert len(metrics) == 2, metrics
          assert any(
              item.get("scenario_recall") == 1.0
              and item.get("false_positive_rate", 1.0) <= 0.15
              for item in metrics
          ), metrics
          PY
          MODEL_ID="$(
            TRAIN_JSON="$TRAIN_JSON" uv run python -c 'import json, os; train=json.loads(os.environ["TRAIN_JSON"]); passing=[c for c in train["candidates"] if c["metrics"].get("scenario_recall") == 1.0 and c["metrics"].get("false_positive_rate", 1.0) <= 0.15]; print((passing or train["candidates"])[0]["model_id"])'
          )"
          OTHER_ID="$(
            TRAIN_JSON="$TRAIN_JSON" MODEL_ID="$MODEL_ID" uv run python -c 'import json, os; train=json.loads(os.environ["TRAIN_JSON"]); print(next(c["model_id"] for c in train["candidates"] if c["model_id"] != os.environ["MODEL_ID"]))'
          )"
          uv run sentinelueba ml models verify "$MODEL_ID"
          uv run sentinelueba ml models verify "$OTHER_ID"
          uv run sentinelueba ml evaluate "$MODEL_ID"
          COMPARE_JSON="$(uv run sentinelueba ml models compare "$MODEL_ID" "$OTHER_ID")"
          COMPARE_JSON="$COMPARE_JSON" MODEL_ID="$MODEL_ID" uv run python - <<'PY'
          import json
          import os
          compare = json.loads(os.environ["COMPARE_JSON"])
          assert compare["recommendation_order"][0] == os.environ["MODEL_ID"], compare
          PY
          uv run sentinelueba ml models promote "$MODEL_ID" --confirm
          MODEL_ID="$MODEL_ID" uv run python - <<'PY'
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage
          storage = SQLiteStorage(get_settings().database_path)
          models = storage.list_model_versions(lifecycle_status="champion")
          assert len(models) == 1, models
          assert models[0]["model_id"] == __import__("os").environ["MODEL_ID"], models
          PY
          uv run sentinelueba ml models promote "$OTHER_ID" --confirm
          MODEL_ID="$MODEL_ID" OTHER_ID="$OTHER_ID" uv run python - <<'PY'
          import os
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage
          storage = SQLiteStorage(get_settings().database_path)
          models = {item["model_id"]: item for item in storage.list_model_versions()}
          assert models[os.environ["MODEL_ID"]]["lifecycle_status"] == "retired", models
          assert models[os.environ["OTHER_ID"]]["lifecycle_status"] == "champion", models
          assert len(storage.list_model_versions(lifecycle_status="champion")) == 1
          PY
          uv run sentinelueba ml models rollback "$MODEL_ID" --confirm
          MODEL_ID="$MODEL_ID" OTHER_ID="$OTHER_ID" uv run python - <<'PY'
          import os
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage
          storage = SQLiteStorage(get_settings().database_path)
          models = {item["model_id"]: item for item in storage.list_model_versions()}
          assert models[os.environ["MODEL_ID"]]["lifecycle_status"] == "champion", models
          assert models[os.environ["OTHER_ID"]]["lifecycle_status"] == "retired", models
          assert len(storage.list_model_versions(lifecycle_status="champion")) == 1
          assert storage.list_model_promotions()[0]["action"] == "rollback"
          PY
          SCORE_JSON="$(uv run sentinelueba ml score --dataset "$DATASET_ID" --model "$MODEL_ID")"
          SCORE_JSON="$SCORE_JSON" uv run python - <<'PY'
          import json
          import os
          score = json.loads(os.environ["SCORE_JSON"])
          assert score["window_count"] == 96, score
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage
          run = SQLiteStorage(get_settings().database_path).get_scoring_run(score["scoring_run_id"])
          assert run["status"] == "success", run
          assert len(run["windows"]) == 96, run
          PY
          DRIFT_JSON="$(uv run sentinelueba ml drift --dataset "$DATASET_ID" --model "$MODEL_ID")"
          DRIFT_JSON="$DRIFT_JSON" uv run python - <<'PY'
          import json
          import os
          drift = json.loads(os.environ["DRIFT_JSON"])
          assert drift["status"] == "ok", drift
          PY
          DRY_RUN_JSON="$(uv run sentinelueba detection run-once --dataset synthetic --dry-run)"
          DRY_RUN_JSON="$DRY_RUN_JSON" uv run python - <<'PY'
          import json
          import os
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage

          dry = json.loads(os.environ["DRY_RUN_JSON"])
          assert dry["status"] == "dry_run", dry
          assert dry["evaluated_count"] == 96, dry
          storage = SQLiteStorage(get_settings().database_path)
          with storage.connect() as conn:
              assert conn.execute("SELECT COUNT(*) FROM detection_runs").fetchone()[0] == 0
              assert conn.execute("SELECT COUNT(*) FROM detection_evaluations").fetchone()[0] == 0
              assert conn.execute("SELECT COUNT(*) FROM findings").fetchone()[0] == 0
          PY
          DETECTION_JSON="$(uv run sentinelueba detection run-once --dataset synthetic)"
          DETECTION_JSON="$DETECTION_JSON" uv run python - <<'PY'
          import json
          import os
          detection = json.loads(os.environ["DETECTION_JSON"])
          assert detection["evaluated_count"] == 96, detection
          assert detection["finding_count"] >= 5, detection
          PY
          TRAIN_JSON="$TRAIN_JSON" uv run python - <<'PY'
          import json
          import os
          from datetime import datetime

          from sentinelueba.config import get_settings
          from sentinelueba.services.pipeline import DemoPipeline
          from sentinelueba.storage.sqlite import SQLiteStorage

          settings = get_settings()
          pipe = DemoPipeline(settings)
          storage = SQLiteStorage(settings.database_path)
          train = json.loads(os.environ["TRAIN_JSON"])
          scenario_ids = set(train["split"]["scenario_window_ids"])
          assert len(scenario_ids) == 5, scenario_ids
          with storage.connect() as conn:
              rows = conn.execute(
                  """
                  SELECT * FROM detection_evaluations
                  WHERE window_id IN ({})
                  ORDER BY created_at
                  """.format(",".join("?" for _ in scenario_ids)),
                  tuple(sorted(scenario_ids)),
              ).fetchall()
          by_window = {row["window_id"]: dict(row) for row in rows}
          assert set(by_window) == scenario_ids, by_window
          assert {row["status"] for row in by_window.values()} == {"finding"}, by_window
          raw_forbidden = (
              "demo-user",
              "demo-host",
              "payload",
              "process_path",
              "remote_address",
              "scenario",
          )
          for row in by_window.values():
              blob = json.dumps(
                  {
                      "decision": json.loads(row["decision_json"]),
                      "signals": json.loads(row["matched_signal_ids_json"]),
                  },
                  sort_keys=True,
              ).lower()
              assert not any(item in blob for item in raw_forbidden), blob

          finding_id = next(
              row["finding_id"] for row in by_window.values() if row["finding_id"] is not None
          )
          pipe.detection_transition_finding(
              finding_id,
              to_status="acknowledged",
              reason="ci-smoke acknowledge",
          )
          pipe.detection_transition_finding(
              finding_id,
              to_status="investigating",
              reason="ci-smoke investigate",
          )
          resolved = pipe.detection_transition_finding(
              finding_id,
              to_status="resolved",
              reason="ci-smoke resolve",
              confirm=True,
          )
          assert resolved["status"] == "resolved", resolved
          assert [item["to_status"] for item in resolved["history"]][-3:] == [
              "acknowledged",
              "investigating",
              "resolved",
          ]

          suppression = pipe.detection_create_suppression(
              scope="signal_for_dataset_kind",
              dataset_kind="synthetic",
              signal_id="rare-process-v1",
              ttl_minutes=30,
              reason="ci-smoke-active",
          )
          rare_window_id = next(
              row["window_id"]
              for row in by_window.values()
              if "rare-process-v1" in row["matched_signal_ids_json"]
          )
          rare_window = next(
              window
              for window in storage.list_feature_windows(dataset_kind="synthetic")
              if window["window_id"] == rare_window_id
          )
          old_hash = str(rare_window["feature_input_hash"])
          revised = dict(rare_window)
          revised["source_event_hash"] = f"{rare_window['source_event_hash']}-ci-revised"
          storage.upsert_feature_windows([revised])
          suppressed = pipe.detection_run_once(
              dataset_kind="synthetic",
              start=datetime.fromisoformat(str(revised["window_start"])),
              end=datetime.fromisoformat(str(revised["window_end"])),
              max_windows=8,
          )
          assert suppressed["evaluated_count"] == 1, suppressed
          with storage.connect() as conn:
              row = conn.execute(
                  """
                  SELECT * FROM detection_evaluations
                  WHERE window_id = ? AND feature_input_hash <> ?
                  ORDER BY created_at DESC
                  LIMIT 1
                  """,
                  (rare_window_id, old_hash),
              ).fetchone()
          assert row is not None
          assert row["status"] == "suppressed", dict(row)
          assert row["suppression_id"] == suppression["suppression_id"], dict(row)
          assert row["suppression_reason"] == "ci-smoke-active", dict(row)
          assert row["suppression_expires_at"], dict(row)
          assert "rare-process-v1" in row["matched_signal_ids_json"], dict(row)
          decision = json.loads(row["decision_json"])
          assert decision, dict(row)
          pipe.detection_revoke_suppression(str(suppression["suppression_id"]), confirm=True)
          repeat = pipe.detection_run_once(dataset_kind="synthetic")
          assert repeat["examined_count"] == 0, repeat
          assert repeat["evaluated_count"] == 0, repeat
          assert repeat["finding_occurrences"] == 0, repeat
          assert repeat["new_findings"] == 0, repeat
          PY
          NOOP_DETECTION_JSON="$(uv run sentinelueba detection run-once --dataset synthetic)"
          NOOP_DETECTION_JSON="$NOOP_DETECTION_JSON" uv run python - <<'PY'
          import json
          import os
          noop = json.loads(os.environ["NOOP_DETECTION_JSON"])
          assert noop["evaluated_count"] == 0, noop
          assert noop["examined_count"] == 0, noop
          PY
          BACKFILL_JSON="$(uv run sentinelueba detection backfill --policy-id hybrid-policy-v1 --dataset-id "$DATASET_ID" --confirm)"
          BACKFILL_JSON="$BACKFILL_JSON" uv run python - <<'PY'
          import json
          import os
          backfill = json.loads(os.environ["BACKFILL_JSON"])
          assert backfill["status"] == "success", backfill
          assert backfill["evaluated_count"] == 0, backfill
          PY
          SUPPRESSION_JSON="$(
            uv run sentinelueba detection suppressions create \
              --scope signal_for_dataset_kind \
              --dataset synthetic \
              --signal-id rare-process-v1 \
              --ttl-minutes 30 \
              --reason ci-smoke
          )"
          SUPPRESSION_ID="$(
            SUPPRESSION_JSON="$SUPPRESSION_JSON" uv run python -c 'import json, os; print(json.loads(os.environ["SUPPRESSION_JSON"])["suppression_id"])'
          )"
          uv run sentinelueba detection suppressions revoke "$SUPPRESSION_ID" --confirm
          uv run sentinelueba detection worker run-foreground --dataset synthetic --max-windows 16 --single-cycle
          WORKER_STATUS_JSON="$(uv run sentinelueba detection worker status --dataset synthetic)"
          WORKER_STATUS_JSON="$WORKER_STATUS_JSON" uv run python - <<'PY'
          import json
          import os
          status = json.loads(os.environ["WORKER_STATUS_JSON"])
          assert status["worker_key"] == "stage4|synthetic|*", status
          assert status["status"] in {"stopped", "failed"}, status
          PY
          uv run python - <<'PY'
          from sentinelueba.config import get_settings
          from sentinelueba.detection.worker_manager import get_detection_worker_manager

          manager = get_detection_worker_manager()
          settings = get_settings()
          started = manager.start(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
              dataset_kind="synthetic",
              interval_seconds=5,
              max_windows=1,
          )
          assert started["worker_key"] == "stage4|synthetic|*", started
          assert started["status"] in {"running", "idle"}, started
          status = manager.status(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
              dataset_kind="synthetic",
          )
          assert status["worker_key"] == "stage4|synthetic|*", status
          stopped = manager.stop(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
              dataset_kind="synthetic",
              confirm=True,
              timeout_seconds=20,
          )
          assert stopped["status"] in {"stopped", "failed"}, stopped
          manager.shutdown_process(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
          )
          PY
          NOOP_JSON="$(uv run sentinelueba features materialize)"
          NOOP_JSON="$NOOP_JSON" uv run python - <<'PY'
          import json
          import os
          noop = json.loads(os.environ["NOOP_JSON"])
          assert noop["processed_events"] == 0, noop
          assert noop["processed_observations"] == 0, noop
          assert noop["upserted_windows"] == 0, noop
          assert noop["deleted_windows"] == 0, noop
          PY
          test -z "$(git ls-files data artifacts || true)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Build
        run: pnpm --dir frontend build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: uv sync --all-extras --dev
      - name: Unit tests
        run: uv run pytest
      - name: Dataset and ML pipeline smoke
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force data, artifacts -ErrorAction SilentlyContinue
          uv run sentinelueba generate-demo
          uv run sentinelueba features materialize
          uv run sentinelueba datasets create --kind synthetic
          $dataset = Get-ChildItem data/datasets | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          uv run sentinelueba datasets verify $dataset.Name
          $train = uv run sentinelueba ml train --dataset synthetic --dataset-id $dataset.Name --families autoencoder,isolation-forest --autoencoder-epochs 6 --if-n-estimators 16 | ConvertFrom-Json
          if ($train.split.train.count -ne 50 -or $train.split.calibration.count -ne 22 -or $train.split.test.count -ne 24) { throw "unexpected split counts" }
          if ($train.split.scenario_window_ids.Count -ne 5) { throw "unexpected scenario split" }
          $passing = @($train.candidates | Where-Object { $_.metrics.scenario_recall -eq 1.0 -and $_.metrics.false_positive_rate -le 0.15 })
          if ($passing.Count -eq 0) { throw "no passing candidate" }
          $modelId = $passing[0].model_id
          $otherId = @($train.candidates | Where-Object { $_.model_id -ne $modelId })[0].model_id
          uv run sentinelueba ml models verify $modelId
          uv run sentinelueba ml models verify $otherId
          uv run sentinelueba ml evaluate $modelId
          uv run sentinelueba ml models compare $modelId $otherId
          uv run sentinelueba ml models promote $modelId --confirm
          @'
          import os
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage
          storage = SQLiteStorage(get_settings().database_path)
          champions = storage.list_model_versions(lifecycle_status="champion")
          assert len(champions) == 1, champions
          '@ | uv run python -
          uv run sentinelueba ml models promote $otherId --confirm
          uv run sentinelueba ml models rollback $modelId --confirm
          @'
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage
          storage = SQLiteStorage(get_settings().database_path)
          assert len(storage.list_model_versions(lifecycle_status="champion")) == 1
          assert storage.list_model_promotions()[0]["action"] == "rollback"
          '@ | uv run python -
          $score = uv run sentinelueba ml score --dataset $dataset.Name --model $modelId | ConvertFrom-Json
          if ($score.window_count -ne 96) { throw "unexpected scoring count" }
          uv run sentinelueba ml drift --dataset $dataset.Name --model $modelId
          $dryRun = uv run sentinelueba detection run-once --dataset synthetic --dry-run | ConvertFrom-Json
          if ($dryRun.status -ne "dry_run" -or $dryRun.evaluated_count -ne 96) { throw "unexpected dry-run result" }
          @'
          from sentinelueba.config import get_settings
          from sentinelueba.storage.sqlite import SQLiteStorage

          storage = SQLiteStorage(get_settings().database_path)
          with storage.connect() as conn:
              assert conn.execute("SELECT COUNT(*) FROM detection_runs").fetchone()[0] == 0
              assert conn.execute("SELECT COUNT(*) FROM detection_evaluations").fetchone()[0] == 0
              assert conn.execute("SELECT COUNT(*) FROM findings").fetchone()[0] == 0
          '@ | uv run python -
          $detection = uv run sentinelueba detection run-once --dataset synthetic | ConvertFrom-Json
          if ($detection.evaluated_count -ne 96 -or $detection.finding_count -lt 5) { throw "unexpected detection result" }
          $env:TRAIN_JSON = $train | ConvertTo-Json -Depth 20 -Compress
          @'
          import json
          import os
          from datetime import datetime

          from sentinelueba.config import get_settings
          from sentinelueba.services.pipeline import DemoPipeline
          from sentinelueba.storage.sqlite import SQLiteStorage

          settings = get_settings()
          pipe = DemoPipeline(settings)
          storage = SQLiteStorage(settings.database_path)
          train = json.loads(os.environ["TRAIN_JSON"])
          scenario_ids = set(train["split"]["scenario_window_ids"])
          assert len(scenario_ids) == 5, scenario_ids
          with storage.connect() as conn:
              rows = conn.execute(
                  """
                  SELECT * FROM detection_evaluations
                  WHERE window_id IN ({})
                  ORDER BY created_at
                  """.format(",".join("?" for _ in scenario_ids)),
                  tuple(sorted(scenario_ids)),
              ).fetchall()
          by_window = {row["window_id"]: dict(row) for row in rows}
          assert set(by_window) == scenario_ids, by_window
          assert {row["status"] for row in by_window.values()} == {"finding"}, by_window
          raw_forbidden = (
              "demo-user",
              "demo-host",
              "payload",
              "process_path",
              "remote_address",
              "scenario",
          )
          for row in by_window.values():
              blob = json.dumps(
                  {
                      "decision": json.loads(row["decision_json"]),
                      "signals": json.loads(row["matched_signal_ids_json"]),
                  },
                  sort_keys=True,
              ).lower()
              assert not any(item in blob for item in raw_forbidden), blob

          finding_id = next(
              row["finding_id"] for row in by_window.values() if row["finding_id"] is not None
          )
          pipe.detection_transition_finding(
              finding_id,
              to_status="acknowledged",
              reason="ci-smoke acknowledge",
          )
          pipe.detection_transition_finding(
              finding_id,
              to_status="investigating",
              reason="ci-smoke investigate",
          )
          resolved = pipe.detection_transition_finding(
              finding_id,
              to_status="resolved",
              reason="ci-smoke resolve",
              confirm=True,
          )
          assert resolved["status"] == "resolved", resolved
          assert [item["to_status"] for item in resolved["history"]][-3:] == [
              "acknowledged",
              "investigating",
              "resolved",
          ]

          suppression = pipe.detection_create_suppression(
              scope="signal_for_dataset_kind",
              dataset_kind="synthetic",
              signal_id="rare-process-v1",
              ttl_minutes=30,
              reason="ci-smoke-active",
          )
          rare_window_id = next(
              row["window_id"]
              for row in by_window.values()
              if "rare-process-v1" in row["matched_signal_ids_json"]
          )
          rare_window = next(
              window
              for window in storage.list_feature_windows(dataset_kind="synthetic")
              if window["window_id"] == rare_window_id
          )
          old_hash = str(rare_window["feature_input_hash"])
          revised = dict(rare_window)
          revised["source_event_hash"] = f"{rare_window['source_event_hash']}-ci-revised"
          storage.upsert_feature_windows([revised])
          suppressed = pipe.detection_run_once(
              dataset_kind="synthetic",
              start=datetime.fromisoformat(str(revised["window_start"])),
              end=datetime.fromisoformat(str(revised["window_end"])),
              max_windows=8,
          )
          assert suppressed["evaluated_count"] == 1, suppressed
          with storage.connect() as conn:
              row = conn.execute(
                  """
                  SELECT * FROM detection_evaluations
                  WHERE window_id = ? AND feature_input_hash <> ?
                  ORDER BY created_at DESC
                  LIMIT 1
                  """,
                  (rare_window_id, old_hash),
              ).fetchone()
          assert row is not None
          assert row["status"] == "suppressed", dict(row)
          assert row["suppression_id"] == suppression["suppression_id"], dict(row)
          assert row["suppression_reason"] == "ci-smoke-active", dict(row)
          assert row["suppression_expires_at"], dict(row)
          assert "rare-process-v1" in row["matched_signal_ids_json"], dict(row)
          decision = json.loads(row["decision_json"])
          assert decision, dict(row)
          pipe.detection_revoke_suppression(str(suppression["suppression_id"]), confirm=True)
          repeat = pipe.detection_run_once(dataset_kind="synthetic")
          assert repeat["examined_count"] == 0, repeat
          assert repeat["evaluated_count"] == 0, repeat
          assert repeat["finding_occurrences"] == 0, repeat
          assert repeat["new_findings"] == 0, repeat
          '@ | uv run python -
          $noopDetection = uv run sentinelueba detection run-once --dataset synthetic | ConvertFrom-Json
          if ($noopDetection.evaluated_count -ne 0 -or $noopDetection.examined_count -ne 0) { throw "unexpected detection no-op" }
          $backfill = uv run sentinelueba detection backfill --policy-id hybrid-policy-v1 --dataset-id $dataset.Name --confirm | ConvertFrom-Json
          if ($backfill.status -ne "success" -or $backfill.evaluated_count -ne 0) { throw "unexpected snapshot backfill" }
          $suppression = uv run sentinelueba detection suppressions create --scope signal_for_dataset_kind --dataset synthetic --signal-id rare-process-v1 --ttl-minutes 30 --reason ci-smoke | ConvertFrom-Json
          uv run sentinelueba detection suppressions revoke $suppression.suppression_id --confirm
          uv run sentinelueba detection worker run-foreground --dataset synthetic --max-windows 16 --single-cycle
          $workerStatus = uv run sentinelueba detection worker status --dataset synthetic | ConvertFrom-Json
          if ($workerStatus.worker_key -ne "stage4|synthetic|*") { throw "unexpected worker status" }
          @'
          from sentinelueba.config import get_settings
          from sentinelueba.detection.worker_manager import get_detection_worker_manager

          manager = get_detection_worker_manager()
          settings = get_settings()
          started = manager.start(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
              dataset_kind="synthetic",
              interval_seconds=5,
              max_windows=1,
          )
          assert started["worker_key"] == "stage4|synthetic|*", started
          status = manager.status(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
              dataset_kind="synthetic",
          )
          assert status["worker_key"] == "stage4|synthetic|*", status
          stopped = manager.stop(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
              dataset_kind="synthetic",
              confirm=True,
              timeout_seconds=20,
          )
          assert stopped["status"] in {"stopped", "failed"}, stopped
          manager.shutdown_process(
              database_path=settings.database_path,
              data_dir=settings.data_dir,
              model_dir=settings.model_dir,
          )
          '@ | uv run python -
          $noop = uv run sentinelueba features materialize | ConvertFrom-Json
          if ($noop.processed_events -ne 0 -or $noop.processed_observations -ne 0 -or $noop.upserted_windows -ne 0 -or $noop.deleted_windows -ne 0) { throw "unexpected no-op materialization" }
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content $_.FullName -Raw)) | Out-Null
          }
      - name: Safe collector smoke
        shell: pwsh
        run: |
          uv run sentinelueba init
          uv run sentinelueba capabilities
          uv run sentinelueba collect --duration 3 --interval 1
          uv run sentinelueba collector-status
          @'
          import json
          from datetime import UTC, datetime, timedelta

          from sentinelueba.config import get_settings
          from sentinelueba.features.materialization import collector_coverage_for_window
          from sentinelueba.storage.sqlite import SQLiteStorage

          settings = get_settings()
          storage = SQLiteStorage(settings.database_path)
          storage.initialize()

          quarantine = storage.quarantine_summary()
          assert quarantine["count"] == 0, quarantine

          observations = storage.list_collector_observations()
          assert observations, "collector_observations is empty"

          by_collector = {}
          for observation in observations:
              by_collector.setdefault(observation["collector_id"], []).append(observation)
              int(observation["returned_events"])
              int(observation["saved_events"])

          process = by_collector.get("windows.process.psutil", [])
          system = by_collector.get("windows.system_metrics.psutil", [])
          network = by_collector.get("windows.network.psutil", [])
          auth = by_collector.get("windows.auth.security_event_log", [])

          assert any(row["successful_poll"] for row in process), process
          assert any(row["successful_poll"] for row in system), system
          assert network, "network observation is missing"
          assert not any(row["error_class"] == "AccessDenied" for row in auth), auth

          for row in network:
              if row["successful_poll"]:
                  continue
              observed_at = datetime.fromisoformat(row["observed_at"]).astimezone(UTC)
              coverage = collector_coverage_for_window(
                  [row],
                  window_start=observed_at,
                  window_end=observed_at
                  + timedelta(seconds=float(row["configured_interval_seconds"])),
                  user_id=row["user_id"],
                  host_id=row["host_id"],
              )
              assert "windows.network.psutil" not in coverage, json.dumps(row, default=str)

          print(
              json.dumps(
                  {
                      "quarantine_count": quarantine["count"],
                      "observations": len(observations),
                      "process_success": sum(1 for row in process if row["successful_poll"]),
                      "system_success": sum(1 for row in system if row["successful_poll"]),
                      "network_statuses": [row["status"] for row in network],
                  },
                  sort_keys=True,
              )
          )
          '@ | uv run python -

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install backend
        run: uv sync --all-extras --dev
      - name: Package portable bundle
        shell: pwsh
        run: .\scripts\package-windows.ps1 -GitCommit "${{ github.sha }}"
      - name: Verify package smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-ExpectFailure {
            param(
              [scriptblock] $Command,
              [string] $Name
            )
            try {
              & $Command
              $exitCode = $LASTEXITCODE
              if ($null -eq $exitCode -or $exitCode -eq 0) {
                throw "$Name unexpectedly succeeded"
              }
              Write-Host "$Name failed as expected with exit code $exitCode"
              $global:LASTEXITCODE = 0
            } catch {
              if ($_.Exception.Message -like "*unexpectedly succeeded*") { throw }
              Write-Host "$Name failed as expected: $($_.Exception.Message)"
            }
          }
          $zip = "dist\SentinelUEBA-0.5.0-windows-x64-portable.zip"
          $sidecar = Get-Content "$zip.sha256"
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if (-not $sidecar.Contains($actual)) { throw "ZIP SHA-256 sidecar mismatch" }
          $unpack = Join-Path $env:RUNNER_TEMP "SentinelUEBA Package Тест"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $unpack
          New-Item -ItemType Directory -Path $unpack | Out-Null
          Expand-Archive -Path $zip -DestinationPath $unpack
          $package = Join-Path $unpack "SentinelUEBA"
          $env:SENTINELUEBA_PACKAGED = "1"
          $env:SENTINELUEBA_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP "SentinelUEBA Runtime Тест"
          $env:SENTINELUEBA_PACKAGE_ROOT = $package
          $manifestPath = Join-Path $package "release-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.git_commit -ne "${{ github.sha }}") {
            throw "release manifest git_commit does not match GitHub SHA"
          }
          if ($manifest.application_version -ne "0.5.0") {
            throw "release manifest application_version mismatch"
          }
          if (-not (Test-Path (Join-Path $package "dependency-inventory.json"))) {
            throw "dependency inventory missing from package"
          }
          if (-not $manifest.frontend_manifest_sha256) {
            throw "release manifest frontend_manifest_sha256 is missing"
          }
          if (-not (Test-Path (Join-Path $package "frontend\index.html"))) {
            throw "packaged frontend index.html missing from top-level frontend"
          }
          if (-not (Test-Path (Join-Path $package "frontend\frontend-assets.json"))) {
            throw "packaged frontend asset manifest missing from top-level frontend"
          }
          if (Test-Path (Join-Path $package "_internal\frontend")) {
            throw "duplicate packaged frontend exists in _internal"
          }
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            if (Get-Command python -ErrorAction SilentlyContinue) {
              throw "python is unexpectedly available in packaged runtime PATH"
            }
            if (Get-Command node -ErrorAction SilentlyContinue) {
              throw "node is unexpectedly available in packaged runtime PATH"
            }
            Get-ChildItem -Path $package -Recurse -Force |
              ForEach-Object { $_.Attributes = $_.Attributes -bor [IO.FileAttributes]::ReadOnly }
            & "$package\SentinelUEBA.exe" --version
            & "$package\SentinelUEBA.exe" verify-installation
            & "$package\SentinelUEBA.exe" host doctor
            & "$package\SentinelUEBA.exe" generate-demo
            & "$package\SentinelUEBA.exe" features materialize
            & "$package\SentinelUEBA.exe" detection run-once --dataset synthetic --dry-run
            & "$package\SentinelUEBAService.exe" --debug-smoke
          } finally {
            $env:PATH = $savedPath
          }
          $repoRoot = (Get-Location).Path
          $repoFrontendDist = Join-Path $repoRoot "frontend\dist"
          $hiddenRepoFrontendDist = Join-Path $repoRoot "frontend\dist.hidden-package-windows"
          $emptyCwd = Join-Path $env:RUNNER_TEMP "SentinelUEBA Empty CWD Тест"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $emptyCwd
          New-Item -ItemType Directory -Path $emptyCwd | Out-Null
          $repoFrontendHidden = $false
          $emptyCwdActive = $false
          $process = $null
          $controlToken = $null
          try {
            if (Test-Path $repoFrontendDist) {
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $hiddenRepoFrontendDist
              Rename-Item -Path $repoFrontendDist -NewName (Split-Path -Leaf $hiddenRepoFrontendDist)
              $repoFrontendHidden = $true
            }
            Push-Location $emptyCwd
            $emptyCwdActive = $true
            $process = Start-Process -FilePath "$package\SentinelUEBALauncher.exe" -WorkingDirectory $emptyCwd -PassThru -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $statusFile = Join-Path $env:SENTINELUEBA_RUNTIME_ROOT "runtime\status.json"
              if (Test-Path $statusFile) {
                $status = Get-Content $statusFile | ConvertFrom-Json
                if ($status.state -in @("ready", "degraded")) {
                  $ready = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "packaged host did not become ready" }
            $port = $status.port
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/health/ready" | Out-Null
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/" | Out-Null
            $build1 = Invoke-RestMethod "http://127.0.0.1:$port/runtime/build"
            $build2 = Invoke-RestMethod "http://127.0.0.1:$port/runtime/build"
            $manifestHash = (Get-FileHash -Algorithm SHA256 $manifestPath).Hash.ToLowerInvariant()
            if ($build1.data.git_commit -ne $manifest.git_commit) { throw "runtime build git_commit mismatch" }
            if ($build1.data.git_commit -ne "${{ github.sha }}") { throw "runtime build git_commit is not exact head SHA" }
            if ($build1.data.build_timestamp_utc -ne $manifest.build_timestamp_utc) { throw "runtime build timestamp mismatch" }
            if ($build2.data.build_timestamp_utc -ne $build1.data.build_timestamp_utc) { throw "runtime build timestamp changed between calls" }
            if ($build1.data.frontend_build_hash -ne $manifest.frontend_manifest_sha256) { throw "runtime frontend hash mismatch" }
            if ($build1.data.release_manifest_sha256 -ne $manifestHash) { throw "runtime manifest hash mismatch" }
            if ($build1.data.signed -ne $manifest.signed) { throw "runtime signed status mismatch" }
            $statusBefore = Get-Content $statusFile -Raw
            $tokenFile = Join-Path $env:SENTINELUEBA_RUNTIME_ROOT "runtime\control.token"
            $tokenBefore = Get-Content $tokenFile -Raw
            $launcher = Start-Process -FilePath "$package\SentinelUEBALauncher.exe" -WorkingDirectory $emptyCwd -PassThru -WindowStyle Hidden
            $launcher.WaitForExit(20000) | Out-Null
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
              throw "second launcher did not exit"
            }
            if ((Get-Content $statusFile -Raw) -ne $statusBefore) { throw "second launcher modified owner status.json" }
            if ((Get-Content $tokenFile -Raw) -ne $tokenBefore) { throw "second launcher modified owner control.token" }
            try {
              Invoke-WebRequest -UseBasicParsing -Method POST -Uri "http://127.0.0.1:$port/demo/generate" -Body '{"seed":42}' -ContentType "application/json" | Out-Null
              throw "mutation without token succeeded"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
            }
            $bootstrap = Invoke-RestMethod "http://127.0.0.1:$port/runtime/bootstrap"
            $controlToken = $bootstrap.data.control_token
            $headers = @{ "X-SentinelUEBA-Control-Token" = $controlToken }
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/demo/generate" -Headers $headers -Body '{"seed":42}' -ContentType "application/json" | Out-Null
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/runtime/shutdown" -Headers $headers -Body '{"confirm":true}' -ContentType "application/json" | Out-Null
            $process.WaitForExit(20000) | Out-Null
            if (-not $process.HasExited) { throw "packaged host did not stop" }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if ($emptyCwdActive) { Pop-Location }
            if ($repoFrontendHidden) {
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $repoFrontendDist
              Rename-Item -Path $hiddenRepoFrontendDist -NewName "dist"
            }
          }
          if ($controlToken) {
            $logs = Get-ChildItem -Path (Join-Path $env:SENTINELUEBA_RUNTIME_ROOT "logs") -File -Recurse -ErrorAction SilentlyContinue
            foreach ($log in $logs) {
              if ((Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue) -like "*$controlToken*") {
                throw "control token leaked to logs"
              }
            }
          }
          $serviceSmoke = & "$package\SentinelUEBAService.exe" --debug-smoke
          if ($serviceSmoke -notmatch "LocalService") { throw "service smoke did not report LocalService account" }
          $principal = New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($isAdmin) {
            $programDataRoot = Join-Path $env:PROGRAMDATA "SentinelUEBA"
            $serviceStatusFile = Join-Path $programDataRoot "runtime\status.json"
            New-Item -ItemType Directory -Force -Path $programDataRoot | Out-Null
            icacls $programDataRoot /grant "NT AUTHORITY\LOCAL SERVICE:(OI)(CI)F" /T | Out-Null
            icacls $unpack /grant "NT AUTHORITY\LOCAL SERVICE:(OI)(CI)RX" /T | Out-Null
            & "$package\SentinelUEBA.exe" service uninstall --confirm | Out-Null
            try {
              & "$package\SentinelUEBA.exe" service install --confirm
              & "$package\SentinelUEBA.exe" service start
              $serviceReady = $false
              for ($i = 0; $i -lt 90; $i++) {
                if (Test-Path $serviceStatusFile) {
                  $serviceStatus = Get-Content $serviceStatusFile | ConvertFrom-Json
                  if ($serviceStatus.state -in @("ready", "degraded")) {
                    $serviceReady = $true
                    break
                  }
                }
                Start-Sleep -Seconds 1
              }
              if (-not $serviceReady) {
                & "$package\SentinelUEBA.exe" service status
                Get-ChildItem -Path $programDataRoot -Force -Recurse -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length, LastWriteTime |
                  Format-Table -AutoSize | Out-String | Write-Host
                Get-ChildItem -Path (Join-Path $programDataRoot "logs") -File -Recurse -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    Write-Host "---- $($_.FullName)"
                    Get-Content $_.FullName -Tail 200 -ErrorAction SilentlyContinue
                  }
                Get-EventLog -LogName Application -Source SentinelUEBA -Newest 20 -ErrorAction SilentlyContinue |
                  Format-Table -AutoSize | Out-String | Write-Host
                throw "Windows Service host did not become ready"
              }
              $servicePort = $serviceStatus.port
              Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$servicePort/health/ready" | Out-Null
              $serviceBootstrap = Invoke-RestMethod "http://127.0.0.1:$servicePort/runtime/bootstrap"
              $serviceHeaders = @{
                "X-SentinelUEBA-Control-Token" = $serviceBootstrap.data.control_token
              }
              try {
                Invoke-WebRequest -UseBasicParsing -Method POST -Uri "http://127.0.0.1:$servicePort/collection/start" -Headers $serviceHeaders -Body '{"interval_seconds":5}' -ContentType "application/json" | Out-Null
                throw "service collection start unexpectedly succeeded"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 409) { throw }
              }
            } finally {
              try {
                & "$package\SentinelUEBA.exe" service stop --confirm | Out-Null
              } catch {
                Write-Host "service stop cleanup skipped: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 3
              try {
                & "$package\SentinelUEBA.exe" service uninstall --confirm | Out-Null
              } catch {
                Write-Host "service uninstall cleanup skipped: $($_.Exception.Message)"
              }
            }
          } else {
            Write-Host "SCM integration unsupported: runner is not elevated; dispatcher smoke covered by tests."
          }
          Get-ChildItem -Path $package -Recurse -Force |
            ForEach-Object { $_.Attributes = $_.Attributes -band (-bnot [IO.FileAttributes]::ReadOnly) }
          $corruptUnpack = Join-Path $env:RUNNER_TEMP "SentinelUEBA Corrupt Manifest Тест"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $corruptUnpack
          Expand-Archive -Path $zip -DestinationPath $corruptUnpack
          $corruptPackage = Join-Path $corruptUnpack "SentinelUEBA"
          Invoke-ExpectFailure -Name "corrupt release manifest" -Command {
            Set-Content -Path (Join-Path $corruptPackage "release-manifest.json") -Value "{not-json" -Encoding UTF8
            & "$corruptPackage\SentinelUEBA.exe" verify-installation
          }
          $tamperUnpack = Join-Path $env:RUNNER_TEMP "SentinelUEBA Tamper Тест"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $tamperUnpack
          Expand-Archive -Path $zip -DestinationPath $tamperUnpack
          $tamperPackage = Join-Path $tamperUnpack "SentinelUEBA"
          $tamperManifest = Get-Content (Join-Path $tamperPackage "release-manifest.json") -Raw | ConvertFrom-Json
          $tamperTarget = $tamperManifest.files |
            Where-Object { $_.path -eq "frontend/index.html" -or $_.path -like "*/frontend/index.html" } |
            Select-Object -First 1
          if (-not $tamperTarget) { throw "frontend index asset missing from release manifest" }
          $tamperTargetPath = Join-Path $tamperPackage ($tamperTarget.path.Replace("/", [string][IO.Path]::DirectorySeparatorChar))
          Set-Content -Path $tamperTargetPath -Value "tampered" -Encoding UTF8
          Invoke-ExpectFailure -Name "tampered frontend asset" -Command {
            & "$tamperPackage\SentinelUEBA.exe" verify-installation
          }
          $packageRoot = (Resolve-Path $package).Path
          $runtimeInsidePackage = Get-ChildItem -Path $package -Recurse -File |
            Where-Object {
              $relative = $_.FullName.Substring($packageRoot.Length).TrimStart("\")
              ($relative -match "^(data|artifacts|models|logs)\\") -or
                (($relative -notmatch "^_internal\\") -and
                  ($_.Extension -in ".sqlite3", ".parquet", ".skops", ".pt"))
            }
          if ($runtimeInsidePackage) {
            $runtimeInsidePackage | Select-Object -First 20 -ExpandProperty FullName
            throw "runtime artifacts are present inside package"
          }
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinelueba-windows-portable
          path: |
            dist/SentinelUEBA-0.5.0-windows-x64-portable.zip
            dist/SentinelUEBA-0.5.0-windows-x64-portable.zip.sha256
            dist/SentinelUEBA/release-manifest.json
            dist/SentinelUEBA/dependency-inventory.json
          retention-days: 3
