[project]
name = "sentinelueba"
version = "0.1.0"
description = "Local-first UEBA demo pipeline with synthetic telemetry, PyTorch autoencoder detection, FastAPI, and React."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "SentinelUEBA Contributors" }]
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "numpy>=2.0.0",
  "psutil>=6.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyarrow>=17.0.0",
  "torch>=2.4.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0",
  "pywin32>=306; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[project.scripts]
sentinelueba = "sentinelueba.cli:app"

[build-system]
requires = ["setuptools>=74.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
ignore_missing_imports = true
plugins = []
